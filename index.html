<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sydos Store | المتجر الإلكتروني</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #101114;
  color: white;
}

header {
  background: #191a1f;
  padding: 20px;
  border-bottom: 1px solid #b99a55;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: #d7b66b;
  font-size: 25px;
  font-weight: bold;
}

header span {
  color: #c0c0c0;
}

.hero {
  text-align: center;
  padding: 65px 15px;
  background: linear-gradient(135deg,#25252a,#111);
}

.hero h1 {
  color: #d8b76b;
  font-size: 32px;
  margin-bottom: 15px;
}

.hero p {
  color: #ccc;
  line-height: 2;
}

button {
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  background: linear-gradient(135deg,#d8b76b,#eee0b1);
  color: #171717;
}

.container {
  padding: 25px 15px;
  max-width: 1100px;
  margin: auto;
}

.title {
  color: #d8b76b;
  text-align: center;
  margin: 25px 0;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap: 18px;
}

.card {
  background: #1d1e23;
  border: 1px solid #39393d;
  border-radius: 13px;
  overflow: hidden;
  padding-bottom: 15px;
}

.card img {
  width: 100%;
  height: 210px;
  object-fit: cover;
  background: #333;
}

.card h3 {
  padding: 12px;
}

.price {
  color: #d8b76b;
  padding: 0 12px 12px;
  font-size: 19px;
}

.card button {
  margin: 0 12px;
}

.admin {
  background: #1c1d22;
  border: 1px solid #b99a55;
  padding: 20px;
  border-radius: 12px;
  margin-top: 40px;
}

input, select, textarea {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  background: #292a30;
  color: white;
  border: 1px solid #555;
  border-radius: 7px;
}

footer {
  text-align: center;
  padding: 25px;
  color: #aaa;
  border-top: 1px solid #555;
  margin-top: 40px;
}

.hidden {
  display: none;
}

#orderBox {
  background: #1c1d22;
  padding: 20px;
  border-radius: 12px;
  margin-top: 20px;
}
</style>
</head>

<body>

<header>
  <div class="logo">SYDOS STORE</div>
  <span>متجرك الإلكتروني</span>
</header>

<section class="hero">
  <h1>مرحباً بك في SYDOS STORE</h1>
  <p>
    اكتشف منتجاتنا واستمتع بتجربة تسوق سهلة وآمنة.
    <br>
    الجودة والأناقة في مكان واحد.
  </p>
  <br>
  <button onclick="document.getElementById('products').scrollIntoView()">
    اكتشف المنتجات
  </button>
</section>

<div class="container">

<h2 class="title" id="products">منتجاتنا</h2>

<div class="products" id="productList"></div>

<div id="orderBox" class="hidden">
  <h2 class="title">إتمام الطلب</h2>

  <input id="customerName" placeholder="الاسم واللقب">
  <input id="customerPhone" placeholder="رقم الهاتف">

  <select id="customerWilaya">
    <option value="">اختر الولاية</option>
  </select>

  <input id="customerAddress" placeholder="البلدية والعنوان">
  <input id="quantity" type="number" min="1" value="1">

  <button onclick="sendOrder()">تأكيد الطلب</button>
  <button onclick="closeOrder()">إلغاء</button>
</div>

<section class="admin">
  <h2 class="title">لوحة إدارة المتجر</h2>

  <input type="password" id="adminPassword"
  placeholder="كلمة مرور الإدارة">

  <button onclick="login()">دخول الإدارة</button>

  <div id="adminPanel" class="hidden">

    <h3 style="color:#d8b76b;margin-top:20px">
      إضافة منتج جديد
    </h3>

    <input id="newName" placeholder="اسم المنتج">
    <input id="newPrice" type="number" placeholder="السعر بالدينار">
    <input id="newImage" placeholder="رابط صورة المنتج">

    <textarea id="newDescription"
    placeholder="وصف المنتج"></textarea>

    <button onclick="addProduct()">إضافة المنتج</button>

    <h3 style="margin:25px 0;color:#d8b76b">
      إدارة المنتجات
    </h3>

    <div id="manageProducts"></div>

  </div>
</section>

</div>

<footer>
  SYDOS STORE © 2026
  <br>
  جميع الحقوق محفوظة
</footer>

<script>

const wilayas = [
"أدرار","الشلف","الأغواط","أم البواقي","باتنة",
"بجاية","بسكرة","بشار","البليدة","البويرة",
"تمنراست","تبسة","تلمسان","تيارت","تيزي وزو",
"الجزائر","الجلفة","جيجل","سطيف","سعيدة",
"سكيكدة","سيدي بلعباس","عنابة","قالمة","قسنطينة",
"المدية","مستغانم","المسيلة","معسكر","ورقلة",
"وهران","البيض","إليزي","برج بوعريريج","بومرداس",
"الطارف","تندوف","تيسمسيلت","الوادي","خنشلة",
"سوق أهراس","تيبازة","ميلة","عين الدفلى","النعامة",
"عين تموشنت","غرداية","غليزان","تيميمون",
"برج باجي مختار","أولاد جلال","بني عباس",
"عين صالح","عين قزام","تقرت","جانت","المغير",
"المنيعة","أفلو","بريكة","القنطرة","بئر العاتر",
"العريشة","قصر الشلالة","عين وسارة","مسعد",
"قصر البخاري","بوسعادة","الأبيض سيدي الشيخ"
];

const wilayaSelect = document.getElementById("customerWilaya");

wilayas.forEach((w,i)=>{
  let option = document.createElement("option");
  option.value = w;
  option.textContent = String(i+1).padStart(2,"0")+" - "+w;
  wilayaSelect.appendChild(option);
});

let products = JSON.parse(localStorage.getItem("sydosProducts")) || [];

let selectedProduct = null;

function save(){
  localStorage.setItem("sydosProducts",JSON.stringify(products));
}

function displayProducts(){

  const list = document.getElementById("productList");
  list.innerHTML = "";

  products.forEach((p,i)=>{

    list.innerHTML += `
      <div class="card">
        <img src="${escapeHTML(p.image)}"
        onerror="this.src='https://placehold.co/400x300?text=Product'">

        <h3>${escapeHTML(p.name)}</h3>

        <div class="price">${Number(p.price)} دج</div>

        <p style="padding:0 12px;color:#aaa">
        ${escapeHTML(p.description || "")}
        </p>

        <br>

        <button onclick="openOrder(${i})">
          اطلب الآن
        </button>
      </div>
    `;
  });

  displayManage();
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  })[c]);
}

function login(){

  if(document.getElementById("adminPassword").value === "Sydos2026"){

    document.getElementById("adminPanel").classList.remove("hidden");

    alert("مرحبا بك في لوحة الإدارة");

  }else{
    alert("كلمة المرور غير صحيحة");
  }
}

function addProduct(){

  const name = document.getElementById("newName").value.trim();
  const price = Number(document.getElementById("newPrice").value);
  const image = document.getElementById("newImage").value.trim();
  const description = document.getElementById("newDescription").value.trim();

  if(!name || !Number.isFinite(price) || price<=0 || !image){
    alert("أكمل معلومات المنتج والسعر ورابط الصورة");
    return;
  }

  products.push({name,price,image,description});

  save();
  displayProducts();

  document.getElementById("newName").value="";
  document.getElementById("newPrice").value="";
  document.getElementById("newImage").value="";
  document.getElementById("newDescription").value="";

  alert("تمت إضافة المنتج");
}

function displayManage(){

  const box = document.getElementById("manageProducts");
  if(!box) return;

  box.innerHTML = "";

  products.forEach((p,i)=>{

    box.innerHTML += `
      <div style="padding:12px;border-bottom:1px solid #555">
        ${escapeHTML(p.name)} - ${p.price} دج
        <button onclick="deleteProduct(${i})">حذف</button>
        <button onclick="editProduct(${i})">تعديل</button>
        <button onclick="landing(${i})">صفحة المنتج</button>
      </div>
    `;
  });
}

function deleteProduct(i){

  if(confirm("هل تريد حذف المنتج؟")){
    products.splice(i,1);
    save();
    displayProducts();
  }
}

function editProduct(i){

  const name = prompt("اسم المنتج",products[i].name);
  if(name===null) return;

  const price = prompt("السعر",products[i].price);
  if(price===null) return;

  const n = Number(price);
  if(!name.trim() || !Number.isFinite(n) || n<=0){
    alert("معلومات غير صحيحة");
    return;
  }

  products[i].name=name.trim();
  products[i].price=n;

  save();
  displayProducts();
}

function landing(i){

  const p=products[i];

  alert(
    "صفحة المنتج: "+p.name+
    "\nالسعر: "+p.price+" دج"+
    "\nالوصف: "+p.description
  );
}

function openOrder(i){

  selectedProduct=products[i];

  document.getElementById("orderBox").classList.remove("hidden");

  document.getElementById("orderBox").scrollIntoView();
}

function closeOrder(){
  document.getElementById("orderBox").classList.add("hidden");
}

function sendOrder(){

  const name=document.getElementById("customerName").value.trim();
  const phone=document.getElementById("customerPhone").value.trim();
  const wilaya=document.getElementById("customerWilaya").value;
  const address=document.getElementById("customerAddress").value.trim();
  const quantity=Number(document.getElementById("quantity").value);

  if(!name || !phone || !wilaya || !address ||
     !Number.isInteger(quantity) || quantity<1){
    alert("يرجى ملء جميع المعلومات");
    return;
  }

  const order={
    name,phone,wilaya,address,quantity,
    product:selectedProduct.name,
    total:selectedProduct.price*quantity,
    date:new Date().toLocaleString("ar-DZ")
  };

  let orders=JSON.parse(localStorage.getItem("sydosOrders"))||[];

  orders.push(order);

  localStorage.setItem("sydosOrders",JSON.stringify(orders));

  alert("تم تسجيل الطلب على هذا الجهاز بنجاح");

  closeOrder();
}

displayProducts();

</script>

</body>
</html>
